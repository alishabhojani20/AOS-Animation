<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOS ANIMATION || Animate On Scroll</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>

<div class="parent"><div class="font">AOS Animation</div>

    <div  data-aos="fade-right" class="child"></div>

    <div data-aos="fade-left" class="child"></div>

    <div data-aos="flip-left"
     data-aos-easing="ease-out-cubic"
     data-aos-duration="2000" class="child"></div>

    <div  data-aos="flip-up" class="child"></div>

    <div  data-aos="zoom-in" class="child"></div>

    <div  data-aos="fade-down"
     data-aos-easing="linear"
     data-aos-duration="1500" class="child"></div>
</div>


<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
  AOS.init();
</script>

</body>
</html>
